name: Fix iPad landscape settings

on:
  push:
    paths:
      - '.github/workflows/fix-ipad-landscape.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch iPad landscape layout
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='''/* 设置面板 */\n.overlay { display:none; position:absolute; left:0; top:0; width:100%; height:100%; background:rgba(35,34,30,.58); z-index:20; }\n.panel {\n  width:72%; position:absolute; left:14%; top:7%; background:#faf8f4;\n  border-radius:18px; padding:22px 26px 20px; box-shadow:0 20px 60px rgba(0,0,0,.28);\n}\n.panel h2 { margin:0 0 12px; font-size:24px; }\n.panel label { display:block; margin-top:10px; color:#77736b; font-size:13px; }\n.panel input,.panel textarea {\n  width:100%; margin-top:5px; padding:9px 10px; border:1px solid #d5d0c6; border-radius:8px;\n  font-size:15px; font-family:inherit; background:white;\n}\n.panel textarea { height:94px; resize:none; }\n.panel-help { margin-top:7px; color:#9a958b; font-size:11px; line-height:1.45; }\n.actions { margin-top:15px; text-align:right; }\n'''
          new='''/* 设置面板：针对 iPad mini 2 横屏优化，弹窗永远限制在可视区域内 */\n.overlay {\n  display:none; position:fixed; left:0; top:0; right:0; bottom:0;\n  width:100%; height:100%; background:rgba(35,34,30,.58); z-index:20; overflow:hidden;\n}\n.panel {\n  position:absolute; left:12px; right:12px; top:12px; bottom:12px;\n  width:auto; max-width:860px; margin:0 auto; background:#faf8f4; border-radius:16px;\n  padding:16px 20px 68px; box-shadow:0 20px 60px rgba(0,0,0,.28);\n  overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch;\n}\n.panel h2 { margin:0 0 10px; font-size:22px; }\n.panel label { display:block; margin-top:8px; color:#77736b; font-size:13px; }\n.panel input,.panel textarea {\n  width:100%; margin-top:4px; padding:8px 9px; border:1px solid #d5d0c6; border-radius:8px;\n  font-size:14px; font-family:inherit; background:white;\n}\n.panel textarea { height:72px; resize:none; }\n.panel-help { margin-top:4px; color:#9a958b; font-size:10px; line-height:1.4; }\n.actions {\n  position:sticky; bottom:-68px; z-index:5; margin:14px -20px -68px;\n  padding:12px 20px 16px; text-align:right; background:#faf8f4; border-top:1px solid #e2ddd4;\n}\n'''
          if old not in s:
              raise SystemExit('settings block not found')
          s=s.replace(old,new,1)
          s=s.replace('body.night .panel textarea { background:#1e1f1d; color:#eeeae2; border-color:#4a4b47; }','body.night .panel textarea { background:#1e1f1d; color:#eeeae2; border-color:#4a4b47; }\nbody.night .actions { background:#292a27; border-top-color:#444540; }',1)
          landscape='''\n@media screen and (orientation:landscape) and (max-height:700px) {\n  .panel { left:8px; right:8px; top:8px; bottom:8px; max-width:900px; padding:12px 16px 58px; border-radius:13px; }\n  .panel h2 { font-size:19px; margin-bottom:6px; }\n  .panel label { margin-top:6px; font-size:12px; }\n  .panel input,.panel textarea { padding:6px 8px; font-size:13px; }\n  .panel textarea { height:56px; }\n  .panel-help { font-size:9px; line-height:1.3; margin-top:3px; }\n  .photo-tools { margin-top:6px; }\n  .photo-action { padding:7px 10px; font-size:12px; }\n  .actions { bottom:-58px; margin:10px -16px -58px; padding:9px 16px 12px; }\n  .action { padding:8px 11px; font-size:12px; }\n}\n@media screen and (orientation:landscape) {\n  .controls { bottom:22px; right:22px; }\n  .mode-switch { bottom:18px; }\n  .mode-hint { bottom:56px; }\n}\n'''
          s=s.replace('</style>',landscape+'\n</style>',1)
          s=s.replace('<title>天汇府 · 家庭信息屏 V2.5</title>','<title>天汇府 · 家庭信息屏 V2.6</title>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Optimize settings panel for iPad landscape'
          git push
